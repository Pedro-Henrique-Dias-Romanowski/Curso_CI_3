name: kubernetes

on:
  workflow_call:

jobs:

  EKS:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: configurando credenciais da AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
        
    - run: git clone https://github.com/Pedro-Henrique-Dias-Romanowski/Infra_CI_Kubernetes_ALURA.git

    - name: HashiCorp - Setup terraform
      uses: hashicorp/setup-terraform@v2.0.3

    - run: terraform -chdir=Infra_CI_Kubernetes_ALURA/env/Homolog init

    - run: terraform -chdir=Infra_CI_Kubernetes_ALURA/env/Homolog apply -auto-approve

    - name: Kubectl tool installer
      uses: Azure/setup-kubectl@v3

    - run: aws sts get-caller-identity   

    - run: aws eks update-kubeconfig --region us-west-2  --name homolog2

    - run: kubectl get svc
