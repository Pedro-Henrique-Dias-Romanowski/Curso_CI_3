name: Load Test

on:
  workflow_call:
  
jobs:

  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          
      - run: git clone https://github.com/Pedro-Henrique-Dias-Romanowski/Infra_CI_Curso_AWS_Alura    

      - name: HashiCorp - Setup terraform
        uses: hashicorp/setup-terraform@v2.0.3

      - run: terraform -chdir=Infra_CI_Curso_AWS_Alura/env/Homolog init

      - run: terraform -chdir=Infra_CI_Curso_AWS_Alura/env/Homolog destroy -auto-approve

      - run: terraform -chdir=Infra_CI_Curso_AWS_Alura/env/Homolog apply -auto-approve

      - run: echo "$(terraform -chdir=Infra_CI_Curso_AWS_Alura/env/Homolog output -raw IP_alb)"
        id: URL

      - name: Setup Python
        uses: actions/setup-python@v2.3.3
        with:
          python-version: "3.10"


      - uses: BSFishy/pip-action@v1
        with:
          packages: |
            locust

      - run: |
          cat << 'EOF' > locustfile.py
          from locust import HttpUser, TaskSet, task, between

          class UserTasks(TaskSet):
            @task(1)
            def index(self):
              self.client.get("/bruno")

          class WebsiteUser(HttpUser):
            tasks = [UserTasks]
            wait_time = between(1, 5)
          EOF

      - name: Roda teste de carga
        run: sleep 60s ; locust -f locustfile.py --headless -u 10 -r 5 --run-time 60s -H http://${{ steps.URL.outputs.stdout }}

      - run: terraform -chdir=Infra_CI_Curso_AWS_Alura/env/Homolog destroy -auto-approve  
